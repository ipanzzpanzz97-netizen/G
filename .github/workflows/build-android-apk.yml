name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web bundle
        run: |
          npm run build
          rm -rf dist/assets/aistudio

      - name: Initialize & sync Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../BilikTropis-Android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BilikTropis-Android-APK
          path: BilikTropis-Android.apk
          retention-days: 30

      - name: Create GitHub Release with APK (on tag or manual run)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name == 'main' || github.ref_name == 'master' ? format('apk-build-{0}', github.run_number) : github.ref_name }}
          name: Bilik Tropis Android APK (${{ github.run_number }})
          files: BilikTropis-Android.apk
          generate_release_notes: true
